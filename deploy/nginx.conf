# guatools Nginx 反向代理配置（含 HTTPS）
# 使用方式：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/guatools
#   sudo ln -s /etc/nginx/sites-available/guatools /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d guatool.top   # 自动申请并配置 HTTPS 证书

server {
    listen 80;
    server_name guatool.top;

    # 申请证书后 certbot 会自动加入 443 和证书配置
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 文件传输支持大文件上传
        client_max_body_size 20m;
    }
}
